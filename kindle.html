<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Remote — Slides</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #fff; color: #000;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  /* No flexbox, no vh units, no % heights on absolutely-positioned boxes —
     older Kindle WebKit doesn't reliably support those, which is what was
     collapsing the layout to a quarter of the screen. Every box below gets
     its exact pixel top/left/width/height set by JS on load instead. */
  #app, #bar, #pad, #zonePrev, #zoneNext, #footer, #gotoOverlay {
    position: absolute;
    left: 0;
    width: 100%;
  }
  #bar {
    top: 0;
    border-bottom: 2px solid #000;
    white-space: nowrap;
  }
  #bar .label {
    position: absolute; left: 12px; top: 0;
    font-family: 'Courier New', monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  #status {
    position: absolute; right: 12px; top: 0;
    font-family: 'Courier New', monospace; font-size: 11px; color: #666;
  }
  .zone {
    border-bottom: 2px solid #000;
    text-align: center;
    overflow: hidden;
  }
  #zoneNext { border-bottom: none; }
  .zone .word {
    font-family: Georgia, 'Times New Roman', serif;
    margin: 0;
  }
  .zone .sub {
    position: absolute; left: 0; width: 100%; bottom: 14px; text-align: center;
    font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 1px; color: #666;
  }
  .zone.pressed { background: #000; }
  .zone.pressed .word { color: #fff; }
  .zone.pressed .sub { color: #fff; }
  .zone.disabled .word { color: #999; }
  #footer {
    border-top: 2px solid #000;
    font-family: 'Courier New', monospace; font-size: 11px; color: #666;
  }
  #slidePos {
    position: absolute; left: 12px; top: 0;
    text-decoration: underline;
  }
  #slidePos b { color: #000; }
  #sentFlag {
    position: absolute; right: 12px; top: 0;
    opacity: 0;
  }
  #sentFlag.show { opacity: 1; }

  #gotoOverlay {
    top: 0; height: 100%; background: #fff; z-index: 25; display: none;
  }
  #gotoOverlay.active { display: block; }
  #gotoLabel {
    position: absolute; left: 0; width: 100%; text-align: center;
    font-family: 'Courier New', monospace; font-size: 12px; text-transform: uppercase;
    letter-spacing: 1px; color: #666;
  }
  #gotoInput {
    position: absolute; left: 50%; width: 220px; margin-left: -110px;
    border: 2px solid #000; background: #fff; color: #000;
    font-family: Georgia, serif; font-size: 60px; line-height: 1;
    text-align: center; padding: 8px 0;
  }
  #gotoHint {
    position: absolute; left: 0; width: 100%; text-align: center;
    font-family: 'Courier New', monospace; font-size: 11px; color: #666;
  }
  #gotoCancel, #gotoGo {
    position: absolute; width: 46%; top: 0;
    font-family: 'Courier New', monospace; font-size: 12px; text-transform: uppercase;
    letter-spacing: 1px; border: 2px solid #000; background: #fff; padding: 12px 0;
  }
  #gotoCancel { left: 2%; }
  #gotoGo { left: 52%; }
  #gotoCancel.pressed, #gotoGo.pressed { background: #000; color: #fff; }
</style>
</head>
<body>

<div id="app">
  <div id="bar">
    <span class="label">Remote</span>
    <span id="status">connecting&hellip;</span>
  </div>

  <div id="pad">
    <div class="zone" id="zonePrev">
      <div class="word">&lsaquo; Back</div>
      <div class="sub">previous slide</div>
    </div>
    <div class="zone" id="zoneNext">
      <div class="word">Next &rsaquo;</div>
      <div class="sub">next slide</div>
    </div>
  </div>

  <div id="footer">
    <span id="slidePos">Slide <b>&mdash;</b> / &mdash;</span>
    <span id="sentFlag">sent &#10003;</span>
  </div>
</div>

<div id="gotoOverlay">
  <div id="gotoLabel">Go to slide</div>
  <input id="gotoInput" type="number" inputmode="numeric" min="1" placeholder="&mdash;">
  <div id="gotoHint"></div>
  <button id="gotoCancel">Cancel</button>
  <button id="gotoGo">Go</button>
</div>

<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
<script>
(function () {
  'use strict';

  // ---------------- CONFIG ----------------
  var BASE = "https://raw.githubusercontent.com/cityofsmiles/lac-slides/refs/heads/main/slides/";
  // Ably remote link. Both values must match index.html exactly.
  // Use an Ably key limited to Subscribe + Publish on this one channel.
  var ABLY_KEY = '5CSeZA.ddFNxw:w6jzDrK5oLl6PVuvU8Z-mJgy7o7Uv9TLmKvU7mCnBig';
  var ABLY_CHANNEL = 'lac-slides-k3x8p1';
  var MAX_SLIDES_TO_PROBE = 1000;
  // -----------------------------------------

  function el(id) { return document.getElementById(id); }
  var appEl = el('app'), barEl = el('bar'), padEl = el('pad'), footerEl = el('footer');
  var statusEl = el('status'), slidePos = el('slidePos'), sentFlag = el('sentFlag');
  var zonePrev = el('zonePrev'), zoneNext = el('zoneNext');
  var gotoOverlay = el('gotoOverlay'), gotoInput = el('gotoInput'), gotoHint = el('gotoHint');
  var gotoCancelBtn = el('gotoCancel'), gotoGoBtn = el('gotoGo');
  var wordPrev = zonePrev.getElementsByTagName('div')[0];
  var wordNext = zoneNext.getElementsByTagName('div')[0];

  var index = 0;   // 0-based
  var total = 0;

  // ---------- Pixel-based layout (no flex / vh, for old Kindle WebKit) ----------
  function layout() {
    var w = window.innerWidth || document.documentElement.clientWidth;
    var h = window.innerHeight || document.documentElement.clientHeight;
    var barH = 40, footerH = 34;
    var padH = h - barH - footerH;
    var zoneH = Math.floor(padH / 2);

    appEl.style.height = h + 'px';
    barEl.style.height = barH + 'px';
    padEl.style.top = barH + 'px';
    padEl.style.height = padH + 'px';
    footerEl.style.top = (barH + padH) + 'px';
    footerEl.style.height = footerH + 'px';

    zonePrev.style.top = '0px';
    zonePrev.style.height = zoneH + 'px';
    zoneNext.style.top = zoneH + 'px';
    zoneNext.style.height = (padH - zoneH) + 'px';

    var wordSize = Math.min(60, Math.floor(zoneH * 0.32));
    wordPrev.style.fontSize = wordSize + 'px';
    wordNext.style.fontSize = wordSize + 'px';
    wordPrev.style.lineHeight = zoneH + 'px';
    wordNext.style.lineHeight = (padH - zoneH) + 'px';

    gotoOverlay.style.height = h + 'px';
    gotoLabelTop(h);
  }

  function gotoLabelTop(h) {
    el('gotoLabel').style.top = Math.floor(h * 0.28) + 'px';
    gotoInput.style.top = Math.floor(h * 0.38) + 'px';
    gotoHint.style.top = Math.floor(h * 0.58) + 'px';
    gotoCancelBtn.style.top = Math.floor(h * 0.7) + 'px';
    gotoGoBtn.style.top = Math.floor(h * 0.7) + 'px';
  }

  window.onload = layout;
  window.onresize = layout;
  layout();

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function urlFor(n) { return BASE + 'slide-' + pad2(n) + '.png'; }

  function loadImage(url) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(url); };
      img.onerror = function () { reject(url); };
      img.src = url;
    });
  }

  // Binary-search count (assumes slides are numbered 1..N with no gaps).
  // ~10 image loads instead of one per slide.
  function exists(i) {
    return loadImage(urlFor(i)).then(function () { return true; },
                                     function () { return false; });
  }

  function countSlides() {
    // Phase 1: double until a slide is missing (lo exists or is 0, hi is missing)
    function grow(lo, hi) {
      if (hi > MAX_SLIDES_TO_PROBE) { return Promise.resolve([lo, MAX_SLIDES_TO_PROBE + 1]); }
      return exists(hi).then(function (ok) {
        return ok ? grow(hi, hi * 2) : [lo, hi];
      });
    }
    // Phase 2: binary search between lo (exists) and hi (missing)
    function search(lo, hi) {
      if (hi - lo <= 1) { return Promise.resolve(lo); }
      var mid = Math.floor((lo + hi) / 2);
      return exists(mid).then(function (ok) {
        return ok ? search(mid, hi) : search(lo, mid);
      });
    }
    return grow(0, 1).then(function (r) { return search(r[0], r[1]); });
  }

  function updatePosLabel() {
    var cur = total ? index + 1 : '\u2014';
    var tot = total || '\u2014';
    slidePos.innerHTML = 'Slide <b>' + cur + '</b> / ' + tot;
  }

  function setZonesEnabled(prevOn, nextOn) {
    zonePrev.className = 'zone' + (prevOn ? '' : ' disabled');
    zoneNext.className = 'zone' + (nextOn ? '' : ' disabled');
  }

  function flashSent() {
    sentFlag.className = 'show';
    setTimeout(function () { sentFlag.className = ''; }, 700);
  }

  function flashZone(zone) {
    var base = zone.className.replace(' pressed', '');
    zone.className = base + ' pressed';
    setTimeout(function () { zone.className = base; }, 150);
  }

  var realtime = null, channel = null, linked = false;

  function connectRemote() {
    if (typeof Ably === 'undefined') {
      statusEl.textContent = 'cannot load Ably - check wifi';
      return;
    }
    if (ABLY_KEY === 'YOUR_ABLY_API_KEY') {
      statusEl.textContent = 'set ABLY_KEY first';
      return;
    }
    statusEl.textContent = 'connecting...';
    realtime = new Ably.Realtime({ key: ABLY_KEY, echoMessages: false });
    realtime.connection.on(function (change) {
      var st = change.current;
      linked = (st === 'connected');
      if (st === 'connected') statusEl.textContent = 'linked';
      else if (st === 'connecting') statusEl.textContent = 'connecting...';
      else if (st === 'disconnected') statusEl.textContent = 'disconnected - retrying';
      else if (st === 'suspended') statusEl.textContent = 'offline - retrying';
      else if (st === 'failed') statusEl.textContent = 'failed: ' + ((change.reason && change.reason.message) || 'unknown');
      else if (st === 'closed') statusEl.textContent = 'closed';
    });
    channel = realtime.channels.get(ABLY_CHANNEL);
  }

  function send(cmd) {
    if (!channel || !linked) {
      statusEl.textContent = 'not linked - check wifi';
      return;
    }
    try {
      channel.publish('cmd', cmd, function (err) {
        if (err) statusEl.textContent = 'send failed: ' + (err.message || err);
      });
      flashSent();
    } catch (e) {
      statusEl.textContent = 'send failed - check wifi';
    }
  }

  function goNext() {
    if (total && index >= total - 1) return;
    index += 1;
    updatePosLabel();
    setZonesEnabled(index > 0, !total || index < total - 1);
    send({ action: 'goto', index: index });
    flashZone(zoneNext);
  }

  function goPrev() {
    if (index <= 0) return;
    index -= 1;
    updatePosLabel();
    setZonesEnabled(index > 0, !total || index < total - 1);
    send({ action: 'goto', index: index });
    flashZone(zonePrev);
  }

  function openGoto() {
    gotoHint.textContent = total ? ('1 - ' + total) : 'slide count unknown yet';
    gotoInput.value = total ? String(index + 1) : '';
    gotoOverlay.className = 'active';
    setTimeout(function () { gotoInput.focus(); }, 50);
  }

  function closeGoto() {
    gotoOverlay.className = '';
  }

  function confirmGoto() {
    var n = parseInt(gotoInput.value, 10);
    if (!n || isNaN(n)) { closeGoto(); return; }
    if (total) n = Math.max(1, Math.min(total, n));
    else n = Math.max(1, n);
    index = n - 1;
    updatePosLabel();
    setZonesEnabled(index > 0, !total || index < total - 1);
    send({ action: 'goto', index: index });
    flashSent();
    closeGoto();
  }

  zonePrev.onclick = goPrev;
  zoneNext.onclick = goNext;
  slidePos.onclick = openGoto;
  gotoCancelBtn.onclick = closeGoto;
  gotoGoBtn.onclick = confirmGoto;
  gotoInput.onkeydown = function (e) { if (e.key === 'Enter') confirmGoto(); };

  updatePosLabel();
  setZonesEnabled(false, false);
  connectRemote();
  statusEl.textContent = 'counting slides...';

  countSlides().then(function (n) {
    total = n;
    updatePosLabel();
    setZonesEnabled(index > 0, total > 0 && index < total - 1);
    if (!total) statusEl.textContent = 'no slides found';
    else if (!linked) statusEl.textContent = 'ready';
  });
})();
</script>
</body>
</html>
