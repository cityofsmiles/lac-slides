<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Remote — Slides</title>
<style>
  :root{
    --line:#000;
    --dim:#666;
    --paper:#fff;
    --mono: ui-monospace, 'SF Mono', Consolas, monospace;
    --serif: Georgia, 'Bookerly', 'Palatino', 'Times New Roman', serif;
    --sans: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--paper); color:var(--line);
    font-family:var(--sans); overflow:hidden;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}

  #bar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 12px; border-bottom:2px solid var(--line); flex-shrink:0;
  }
  #bar .label{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em;}
  #status{font-family:var(--mono); font-size:11px; color:var(--dim);}

  #pad{flex:1; display:flex; flex-direction:column;}
  .zone{
    flex:1; display:flex; align-items:center; justify-content:center;
    border-bottom:2px solid var(--line); position:relative;
  }
  .zone:last-child{border-bottom:none;}
  .zone .word{font-family:var(--serif); font-size:15vh; line-height:1; user-select:none;}
  .zone .sub{
    position:absolute; bottom:14px; left:0; right:0; text-align:center;
    font-family:var(--mono); font-size:11px; letter-spacing:0.08em; color:var(--dim);
  }
  .zone.pressed{background:var(--line); color:var(--paper);}
  .zone.pressed .sub{color:var(--paper);}
  .zone.disabled{color:var(--dim);}
  .zone.disabled .word{opacity:0.35;}

  #footer{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px; border-top:2px solid var(--line); flex-shrink:0;
    font-family:var(--mono); font-size:11px; color:var(--dim);
  }
  #slidePos{background:none; border:none; padding:0; color:var(--dim); font-family:var(--mono); font-size:11px; text-decoration:underline;}
  #slidePos b{color:var(--line);}
  #sentFlag{opacity:0;}
  #sentFlag.show{opacity:1;}

  #gotoOverlay{
    position:fixed; inset:0; background:var(--paper); z-index:25; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px;
  }
  #gotoOverlay.active{display:flex;}
  #gotoLabel{font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--dim);}
  #gotoInput{
    width:100%; max-width:220px; border:2px solid var(--line); background:var(--paper); color:var(--line);
    font-family:var(--serif); font-size:15vh; line-height:1; text-align:center; padding:8px 0;
  }
  #gotoRow{display:flex; gap:10px; width:100%; max-width:280px;}
  #gotoGo, #gotoCancel{
    flex:1; font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:0.06em;
    border:2px solid var(--line); background:var(--paper); padding:12px 0;
  }
  #gotoGo:active, #gotoCancel:active{background:var(--line); color:var(--paper);}
  #gotoHint{font-family:var(--mono); font-size:11px; color:var(--dim);}
</style>
</head>
<body>

<div id="app">
  <div id="bar">
    <span class="label">Remote</span>
    <span id="status">connecting&hellip;</span>
  </div>

  <div id="pad">
    <div class="zone" id="zonePrev">
      <div class="word">&lsaquo; Back</div>
      <div class="sub">previous slide</div>
    </div>
    <div class="zone" id="zoneNext">
      <div class="word">Next &rsaquo;</div>
      <div class="sub">next slide</div>
    </div>
  </div>

  <div id="footer">
    <span id="slidePos">Slide <b>&mdash;</b> / &mdash;</span>
    <span id="sentFlag">sent &#10003;</span>
  </div>
</div>

<div id="gotoOverlay">
  <div id="gotoLabel">Go to slide</div>
  <input id="gotoInput" type="number" inputmode="numeric" min="1" placeholder="&mdash;">
  <div id="gotoHint"></div>
  <div id="gotoRow">
    <button id="gotoCancel">Cancel</button>
    <button id="gotoGo">Go</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------------- CONFIG ----------------
  var BASE = "https://raw.githubusercontent.com/cityofsmiles/lac-slides/refs/heads/main/slides/";
  // Must match REMOTE_TOPIC in slide-viewer.html exactly.
  var REMOTE_TOPIC = 'lac-slides-remote-k3x8p1';
  var MAX_SLIDES_TO_PROBE = 300;
  // -----------------------------------------

  function el(id) { return document.getElementById(id); }
  var statusEl = el('status'), slidePos = el('slidePos'), sentFlag = el('sentFlag');
  var zonePrev = el('zonePrev'), zoneNext = el('zoneNext');
  var gotoOverlay = el('gotoOverlay'), gotoInput = el('gotoInput'), gotoHint = el('gotoHint');

  var index = 0;   // 0-based
  var total = 0;   // filled in once probing finishes

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function urlFor(n) { return BASE + 'slide-' + pad(n) + '.png'; }

  function loadImage(url) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(url); };
      img.onerror = function () { reject(url); };
      img.src = url;
    });
  }

  function countSlides() {
    var n = 0;
    function step(i) {
      if (i > MAX_SLIDES_TO_PROBE) { return Promise.resolve(n); }
      return loadImage(urlFor(i)).then(function () {
        n = i;
        return step(i + 1);
      }).catch(function () {
        return n;
      });
    }
    return step(1);
  }

  function updatePosLabel() {
    var cur = total ? index + 1 : '\u2014';
    var tot = total || '\u2014';
    slidePos.innerHTML = 'Slide <b>' + cur + '</b> / ' + tot;
  }

  function setZonesEnabled(prevOn, nextOn) {
    zonePrev.classList.toggle('disabled', !prevOn);
    zoneNext.classList.toggle('disabled', !nextOn);
  }

  function flashSent() {
    sentFlag.classList.add('show');
    setTimeout(function () { sentFlag.classList.remove('show'); }, 700);
  }

  function flashZone(zone) {
    zone.classList.add('pressed');
    setTimeout(function () { zone.classList.remove('pressed'); }, 150);
  }

  function send(cmd) {
    fetch('https://ntfy.sh/' + REMOTE_TOPIC, {
      method: 'POST',
      body: JSON.stringify(cmd)
    }).then(function () {
      flashSent();
      statusEl.textContent = 'linked';
    }).catch(function () {
      statusEl.textContent = 'send failed \u2014 check wifi';
    });
  }

  function goNext() {
    if (total && index >= total - 1) return;
    index += 1;
    updatePosLabel();
    setZonesEnabled(index > 0, !total || index < total - 1);
    send({ action: 'next' });
    flashZone(zoneNext);
  }

  function goPrev() {
    if (index <= 0) return;
    index -= 1;
    updatePosLabel();
    setZonesEnabled(index > 0, !total || index < total - 1);
    send({ action: 'prev' });
    flashZone(zonePrev);
  }

  function openGoto() {
    gotoHint.textContent = total ? ('1 \u2013 ' + total) : 'slide count unknown yet';
    gotoInput.value = total ? String(index + 1) : '';
    gotoOverlay.classList.add('active');
    setTimeout(function () { gotoInput.focus(); }, 50);
  }

  function closeGoto() {
    gotoOverlay.classList.remove('active');
  }

  function confirmGoto() {
    var n = parseInt(gotoInput.value, 10);
    if (!n || isNaN(n)) { closeGoto(); return; }
    if (total) n = Math.max(1, Math.min(total, n));
    else n = Math.max(1, n);
    index = n - 1;
    updatePosLabel();
    setZonesEnabled(index > 0, !total || index < total - 1);
    send({ action: 'goto', index: index });
    flashSent();
    closeGoto();
  }

  zonePrev.addEventListener('click', goPrev);
  zoneNext.addEventListener('click', goNext);
  slidePos.addEventListener('click', openGoto);
  el('gotoCancel').addEventListener('click', closeGoto);
  el('gotoGo').addEventListener('click', confirmGoto);
  gotoInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') confirmGoto(); });

  updatePosLabel();
  setZonesEnabled(false, false);
  statusEl.textContent = 'counting slides\u2026';

  countSlides().then(function (n) {
    total = n;
    updatePosLabel();
    setZonesEnabled(index > 0, total > 0 && index < total - 1);
    statusEl.textContent = total ? 'ready' : 'no slides found';
  });
})();
</script>
</body>
</html>
