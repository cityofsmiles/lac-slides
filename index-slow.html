<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slide Viewer</title>
<style>
  :root { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    overflow: hidden;
    touch-action: manipulation;
  }
  #stage {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #slide {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }
  #counter {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 12px);
    right: 16px;
    color: rgba(255,255,255,0.35);
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    letter-spacing: 0.5px;
    pointer-events: none;
  }
  #linkDot {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 12px);
    left: 16px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #444;
    pointer-events: none;
    transition: background 0.3s ease;
  }
  #linkDot.live { background: #2ecc71; }
  #hint {
    position: fixed;
    top: env(safe-area-inset-top, 12px);
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.45);
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #tapLeft, #tapRight {
    position: fixed;
    top: 0; bottom: 0;
    width: 35%;
    z-index: 5;
  }
  #tapLeft { left: 0; }
  #tapRight { right: 0; }
  #fsBtn {
    position: fixed;
    top: env(safe-area-inset-top, 12px);
    right: 16px;
    z-index: 10;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6);
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="stage">
  <img id="slide" src="" alt="slide">
</div>
<div id="tapLeft"></div>
<div id="tapRight"></div>
<div id="linkDot" title="remote link status"></div>
<div id="counter"></div>
<div id="hint">&larr; &rarr; or tap sides to navigate &middot; F for fullscreen</div>
<button id="fsBtn">Fullscreen</button>

<script>
(function () {
  // ---------------- CONFIG ----------------
  // Total number of slides. Update this if you add/remove slides.
  var TOTAL = 400;
  // How many slides ahead to prefetch.
  var AHEAD = 5;
  // CDN first (fast, long cache); raw GitHub as automatic fallback.
  var BASES = [
    "https://cdn.jsdelivr.net/gh/cityofsmiles/lac-slides@main/slides/",
    "https://raw.githubusercontent.com/cityofsmiles/lac-slides/refs/heads/main/slides/"
  ];
  var baseIdx = 0;
  // Must match REMOTE_TOPIC in kindle-remote.html exactly.
  var REMOTE_TOPIC = 'lac-slides-remote-k3x8p1';
  // -----------------------------------------

  var current = 1;
  var img = document.getElementById('slide');
  var counter = document.getElementById('counter');
  var hint = document.getElementById('hint');
  var linkDot = document.getElementById('linkDot');
  var cache = {}; // keep references so prefetched images stay in memory

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function urlFor(n) { return BASES[baseIdx] + 'slide-' + pad(n) + '.png'; }

  function prefetch(n) {
    var i, im;
    for (i = n - 1; i <= Math.min(n + AHEAD, TOTAL); i++) {
      if (i < 1 || cache[i]) continue;
      im = new Image();
      im.src = urlFor(i);
      cache[i] = im;
    }
    // Free memory for slides far behind/ahead of the current one
    Object.keys(cache).forEach(function (k) {
      if (Math.abs(k - n) > 12) delete cache[k];
    });
  }

  function show(n) {
    if (n < 1) n = 1;
    if (n > TOTAL) n = TOTAL;
    current = n;
    img.src = cache[n] ? cache[n].src : urlFor(n);
    counter.textContent = current + ' / ' + TOTAL;
    prefetch(n);
  }

  // If the CDN fails, fall back to the next base URL and retry.
  img.addEventListener('error', function () {
    if (baseIdx < BASES.length - 1) {
      baseIdx++;
      cache = {};
      show(current);
    }
  });

  function next() { show(current + 1); }
  function prev() { show(current - 1); }
  function goto(n) { show(n); }

  show(1);

  document.getElementById('tapRight').addEventListener('click', next);
  document.getElementById('tapLeft').addEventListener('click', prev);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
    else if (e.key === 'Home') { show(1); }
    else if (e.key === 'End') { show(TOTAL); }
  });

  var touchStartX = null;
  document.addEventListener('touchstart', function (e) { touchStartX = e.touches[0].clientX; });
  document.addEventListener('touchend', function (e) {
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (dx < -40) next();
    else if (dx > 40) prev();
    touchStartX = null;
  });

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function () {});
    } else {
      document.exitFullscreen().catch(function () {});
    }
  }
  document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);

  setTimeout(function () { hint.style.opacity = '0'; }, 4000);

  // ---------- Remote control link (receives commands over ntfy.sh) ----------
  function connectRemote() {
    if (typeof EventSource === 'undefined') return;
    var url = 'https://ntfy.sh/' + REMOTE_TOPIC + '/sse';
    var es = new EventSource(url);
    es.onopen = function () { linkDot.classList.add('live'); };
    es.onerror = function () { linkDot.classList.remove('live'); };
    es.onmessage = function (evt) {
      var payload;
      try { payload = JSON.parse(evt.data); } catch (e) { return; }
      if (!payload || !payload.message) return;
      var cmd;
      try { cmd = JSON.parse(payload.message); } catch (e) { return; }
      if (!cmd || !cmd.action) return;
      if (cmd.action === 'next') next();
      else if (cmd.action === 'prev') prev();
      else if (cmd.action === 'goto' && typeof cmd.index === 'number') goto(cmd.index + 1);
    };
  }
  connectRemote();
})();
</script>
</body>
</html>
